<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Christmas Family Feud</title>
  <link rel="stylesheet" href="/styles.css">

<body class="landing-page">

        <path d="M48 8 20 48h16L18 72h22v16h16V72h22L60 48h16L48 8Z" fill="currentColor"/>

        <circle cx="37" cy="60" r="4" fill="#f3d982"/>
