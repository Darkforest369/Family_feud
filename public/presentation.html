<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFF8DC">
  <title>Family Feud</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/socket.io/socket.io.js" defer></script>
  <script src="/presentation.js" defer></script>
</head>
<body class="presentation-page">
  <main class="presentation-shell">
    <header class="room-banner">
      <div class="room-info">
        <p class="eyebrow">Room code · share with players</p>
        <div id="presentation-room-code" class="room-code">-----</div>
        <p class="room-theme-label">Theme: <strong id="presentation-theme-name">Default</strong></p>
        <a id="presentation-join-url" class="join-url" href="#" target="_blank" rel="noopener"></a>
      </div>
      <div class="qr-share">
        <img id="presentation-qr-image" alt="QR code to join this game">
        <span>Scan to join</span>
      </div>
    </header>
    <div id="presentation-reconnecting" class="presentation-reconnecting" role="status" hidden>Reconnecting…</div>
    <div id="presentation-error" class="presentation-error" role="status" hidden></div>
    <section class="score-strip presentation-scoreboard" aria-label="Round scoreboard">
      <div class="score-team score-blue">
        <span class="team-label">BLUE</span>
        <span id="presentation-blue-strikes" class="presentation-strikes" aria-label="Blue team strikes"></span>
        <strong id="presentation-blue-score">0</strong>
      </div>
      <div class="score-center">
        <span>ROUND</span>
        <strong id="presentation-round-number">0</strong>
      </div>
      <div class="score-team score-red">
        <span class="team-label">RED</span>
        <span id="presentation-red-strikes" class="presentation-strikes" aria-label="Red team strikes"></span>
        <strong id="presentation-red-score">0</strong>
      </div>
    </section>
    <section id="presentation-game" class="presentation-game" aria-live="polite">
      <p id="presentation-active-team" class="presentation-active-team" hidden></p>
      <div id="presentation-timer" class="presentation-timer" role="timer" aria-live="off" hidden></div>
      <h1 id="presentation-question" class="presentation-question">Waiting for the host to start a question</h1>
      <div id="presentation-answer-board" class="presentation-answer-board"></div>
    </section>
    <section id="presentation-final" class="presentation-final" aria-live="polite" hidden>
      <p class="eyebrow">Final score</p>
      <h1 id="presentation-winner" class="presentation-winner"></h1>
    </section>
  </main>
</body>
</html>
